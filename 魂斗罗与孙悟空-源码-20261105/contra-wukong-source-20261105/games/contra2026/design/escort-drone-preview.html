<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>护卫无人机造型检查</title>
<style>body{margin:0;background:#080e11;color:#d8ccb8;font:15px system-ui;text-align:center}canvas{display:block;width:min(100vw,1152px);height:auto;margin:auto}button{padding:8px 14px;margin:12px 4px;background:#26352e;border:1px solid #73806a;color:inherit;cursor:pointer}</style>
<canvas width="1536" height="864"></canvas><button id="size">放大观察</button><button id="face">朝向左侧</button><button id="fire">开火演示</button><button id="pause">暂停预览</button>
<script type="module">
import {StageOneArt} from '../js/stage-one-art.mjs?v=runner-hazards-1';
import {StageSevenArt} from '../js/stage-seven-art.mjs?v=escort-drone-2';
import {createStageSevenSolids} from '../js/stage-seven-layout.mjs?v=hangar-bay-depth-1';
import {drawEscortDrone,aimEscortDrone,escortDroneMuzzle} from '../js/escort-drone.mjs?v=escort-drone-2';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),options={createCanvas:()=>document.createElement('canvas'),imageFactory:()=>new Image(),autoLoad:false};
const baseArt=new StageOneArt(options),art=new StageSevenArt({...options,baseArt,hangar:true}),solids=createStageSevenSolids();
await Promise.all([...Object.keys(art.assets).map(k=>art.loadImage(k)),baseArt.loadImage('actorBlue')]);
let detail=false,face=1,firing=false,paused=false,time=1,last=performance.now();
document.querySelector('#size').onclick=()=>{detail=!detail;document.querySelector('#size').textContent=detail?'实机尺寸':'放大观察';};
document.querySelector('#face').onclick=()=>{face=-face;document.querySelector('#face').textContent=face>0?'朝向左侧':'朝向右侧';};
document.querySelector('#fire').onclick=()=>{firing=!firing;document.querySelector('#fire').textContent=firing?'停止开火':'开火演示';};
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'继续预览':'暂停预览';};
function frame(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!paused)time+=dt;
  art.prepare(ctx);baseArt.scale=art.scale;art.state={stage:7,camX:0,time,t:time*60};art.hangarBackdrop(0);art.hangarFloor(solids,0);
  const player={x:100,y:176,face,onGround:true,ax:face,ay:0};if(!detail)art.actor(player,'blue');
  const drone={...player,x:detail?face*12:100,droneT:12,dx2:detail?0:100-face*12,dy2:detail?0:132+Math.sin(time*4)*1.2,droneShotT:firing?(paused?.04:Math.max(0,.08-time%.3)):0};
  aimEscortDrone(drone,{x:drone.dx2+face*140,y:drone.dy2+(firing?12:3.3)});
  art.g.save();if(detail){art.g.translate(192,114);art.g.scale(4.7,4.7);}drawEscortDrone(art,drone);
  if(firing&&!detail){const muzzle=escortDroneMuzzle(drone);art.bullets(Array.from({length:3},(_,i)=>({k:'b',x:muzzle.x+face*((time%.3)*300+i*35),y:muzzle.y+(time%.3)*22+i*2.5})));}
  art.g.restore();art.hudText(detail?'护卫无人机 · 细节预览':'第七关 · 护卫无人机实机尺寸',192,5,'#ffe0ab',8,'center');art.present(ctx);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);window.dronePreviewReady=true;
</script></html>
