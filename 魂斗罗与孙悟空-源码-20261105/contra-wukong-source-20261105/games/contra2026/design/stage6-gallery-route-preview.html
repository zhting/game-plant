<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>第六关多层喷火通道检查</title>
<style>body{margin:0;background:#090e11;color:#dac9ae;font:15px system-ui;text-align:center}canvas{display:block;width:min(100vw,1152px);height:auto;margin:auto}button{margin:12px 4px;padding:8px 14px;background:#25312d;border:1px solid #65705a;color:inherit;cursor:pointer}button[aria-pressed=true]{border-color:#efb873}</style>
<canvas width="1536" height="864"></canvas><button data-pose="ascent">左侧上行</button><button data-pose="crown">顶部横越</button><button data-pose="descent">右侧下降</button><button id="fire">显示喷火</button><button id="pause">暂停预览</button>
<script type="module">
import {StageOneArt} from '../js/stage-one-art.mjs?v=runner-hazards-1';
import {StageSixArt} from '../js/stage-six-art.mjs?v=gallery-climb-return-1';
import {STAGE_SIX_GALLERY,createStageSixGallerySolids} from '../js/stage-six-combat.mjs?v=gallery-climb-return-1';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),options={createCanvas:()=>document.createElement('canvas'),imageFactory:()=>new Image(),autoLoad:false};
const baseArt=new StageOneArt(options),art=new StageSixArt({...options,baseArt}),q=STAGE_SIX_GALLERY,camera=2400,solids=[{x:2460,y:176,w:840,h:40,g:1},{x:2410,y:136,w:64,h:8,g:0},...createStageSixGallerySolids()];
await Promise.all([...Object.keys(art.assets).map(k=>art.loadImage(k)),baseArt.loadImage('actorBlue')]);
let pose='ascent',fire=false,paused=false,time=1,last=performance.now();
for(const button of document.querySelectorAll('[data-pose]'))button.onclick=()=>{pose=button.dataset.pose;for(const node of document.querySelectorAll('[data-pose]'))node.setAttribute('aria-pressed',String(node===button));};
document.querySelector('[data-pose]').setAttribute('aria-pressed','true');document.querySelector('#fire').onclick=()=>{fire=!fire;document.querySelector('#fire').textContent=fire?'隐藏喷火':'显示喷火';};document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'继续预览':'暂停预览';};
function frame(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(!paused)time+=dt;
  art.prepare(ctx);baseArt.scale=art.scale;art.state={stage:6,camX:camera,time,t:time*60};art.backdrop(camera);art.g.save();art.g.translate(-camera,0);art.gallery(camera);art.floor(solids,camera);
  art.jets(q.outlets.map(j=>({...j,st:fire?'fire':'off',k:fire?.92:0})),[],camera);
  const p=pose==='ascent'?{x:2580,y:96}:pose==='crown'?{x:2645,y:q.crownTop}:{x:2720,y:136};art.actor({...p,face:1,onGround:true,ax:1,ay:0},'blue');
  art.g.restore();art.hudText('第六关 · 多层喷火通道',192,4,'#ffe0aa',8,'center');art.present(ctx);requestAnimationFrame(frame);
}
requestAnimationFrame(frame);window.galleryPreviewReady=true;
</script></html>
