<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>第八关幼体屈腿跳跃</title>
<style>body{margin:0;background:#080611;color:#ddc5d5;font:15px system-ui;text-align:center}canvas{display:block;width:min(100vw,1152px);height:auto;margin:auto}button{margin:12px 4px;padding:8px 14px;background:#241525;border:1px solid #75516c;color:inherit;cursor:pointer}</style>
<canvas width="1536" height="864"></canvas><button id="pause">暂停动作</button><button id="pose">逐帧查看</button><button id="auto">自动跳跃</button><button id="size">显示原尺寸</button>
<script type="module">
import {StageOneArt} from '../js/stage-one-art.mjs?v=runner-hazards-1';
import {StageSevenArt} from '../js/stage-seven-art.mjs?v=larva-hop-1';
import {advanceLarvaHop,larvaHopFrame,LARVA_HOP_ART} from '../js/larva-hop.mjs?v=larva-hop-1';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),options={createCanvas:()=>document.createElement('canvas'),imageFactory:()=>new Image(),autoLoad:false};
const baseArt=new StageOneArt(options),art=new StageSevenArt({...options,baseArt});await Promise.all(['cavern','terrain','larva'].map(k=>art.loadImage(k)));
const babies=[{t:'larva',x:110,y:176,on:true,vx:0,vy:0,face:1,hopT:.45},{t:'larva',x:280,y:176,on:true,vx:0,vy:0,face:-1,hopT:.8}];
const poses=[{on:true,hopT:1},{on:true,hopT:.1},{on:false,hopAirT:.03,vy:-180},{on:false,hopAirT:.15,vy:-40},{on:false,hopAirT:.4,vy:120},{on:true,landT:.1,hopT:.8}];
let time=0,last=performance.now(),paused=false,manual=-1,zoom=3;
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'继续动作':'暂停动作';};
document.querySelector('#pose').onclick=()=>manual=(manual+1)%6;document.querySelector('#auto').onclick=()=>manual=-1;
document.querySelector('#size').onclick=()=>{zoom=zoom===3?1:3;document.querySelector('#size').textContent=zoom===3?'显示原尺寸':'放大三倍';};
function frame(now){const dt=Math.min(.035,(now-last)/1000);last=now;if(!paused){time+=dt;if(manual<0)for(const [i,e]of babies.entries()){
  const on=e.on,vx=e.vx;e.vy=Math.min(e.vy+760*dt,340);e.x+=e.vx*dt;e.y+=e.vy*dt;e.on=false;
  if(e.vy>=0&&e.y>=176){e.y=176;e.vy=0;e.on=true;e.vx=0;}
  if(e.on){e.hopT-=dt;if(e.hopT<=0){e.hopT=.8;e.vx=(e.x>(i?280:110)?-1:1)*85;e.vy=-190;e.on=false;}}
  advanceLarvaHop(e,on,dt,vx);
}}
  art.prepare(ctx);baseArt.scale=art.scale;art.state={stage:8,camX:0,time,t:time*60,freezeT:0};art.backdrop(0);art.floor([{x:0,y:176,w:640,h:40,g:1}],0);
  for(const [i,e]of babies.entries()){const pose=manual>=0?{...e,landT:0,hopAirT:0,...poses[manual]}:e;art.g.save();art.g.translate(manual>=0?(i?276:108):e.x,manual>=0?176:e.y);art.g.scale(zoom,zoom);art.enemy({...pose,x:0,y:0});art.g.restore();}
  art.hudText('第八关 · 幼体屈腿跳跃'+(zoom===3?'（三倍细节预览）':''),192,8,'#edc5df',7,'center');if(manual>=0)art.hudText(LARVA_HOP_ART.frames[manual].name,192,22,'#d7adca',6,'center');art.present(ctx);
  window.larvaPreview={time,paused,manual,zoom,frames:babies.map(e=>larvaHopFrame(manual>=0?{...e,landT:0,hopAirT:0,...poses[manual]}:e))};requestAnimationFrame(frame);
}
requestAnimationFrame(frame);window.larvaPreviewReady=true;
</script></html>
