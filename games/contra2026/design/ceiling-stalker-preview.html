<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>第八关 · 顶部爬行扑击怪</title>
<style>body{margin:0;background:#080611;color:#ddc5d5;font:15px system-ui;text-align:center}canvas{display:block;width:min(100vw,1152px);height:auto;margin:auto}button{margin:12px 4px;padding:8px 14px;background:#241525;border:1px solid #75516c;color:inherit}</style>
<canvas width="1536" height="864"></canvas><button id="pause">暂停</button><button id="dodge">玩家向右躲避</button><button id="reset">重播扑击</button>
<script type="module">
import {StageOneArt} from '../js/stage-one-art.mjs?v=runner-hazards-1';
import {StageSevenArt} from '../js/stage-seven-art.mjs?v=ceiling-stalker-1';
import {createCeilingStalkers,advanceCeilingStalker,drawStalkerRoofs} from '../js/ceiling-stalker.mjs?v=ceiling-stalker-1';
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d'),options={createCanvas:()=>document.createElement('canvas'),imageFactory:()=>new Image(),autoLoad:false};
const baseArt=new StageOneArt(options),art=new StageSevenArt({...options,baseArt});
await Promise.all(['cavern','terrain','intestineMotion','cystMotion','ceilingStalker','chasm'].map(k=>art.loadImage(k)).concat(baseArt.loadImage('actorBlue')));
const camera=320,solids=[{x:0,y:176,w:640,h:40,g:1},{x:700,y:176,w:400,h:40,g:1},{x:420,y:100,w:80,h:8}],land=(x,a,b,hw,skip)=>solids.filter(s=>(!skip||s.g||s.solid)&&x+hw>s.x&&x-hw<s.x+s.w&&a<=s.y&&b>=s.y).sort((a,b)=>a.y-b.y)[0]||null;
let time=0,last=performance.now(),paused=false,mob=createCeilingStalkers()[0],player={x:480,y:176},destination=480;
document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'继续':'暂停';};
document.querySelector('#dodge').onclick=()=>{destination=610;};
document.querySelector('#reset').onclick=()=>{mob=createCeilingStalkers()[0];player.x=destination=480;time=0;};
function frame(now){
  const dt=Math.min(.04,(now-last)/1000);last=now;if(!paused){time+=dt;player.x+=Math.sign(destination-player.x)*Math.min(Math.abs(destination-player.x),90*dt);advanceCeilingStalker(mob,player,dt,{active:true,camera,land});}
  art.prepare(ctx);baseArt.scale=art.scale;art.state={stage:8,camX:camera,time,t:time*60,freezeT:0,s8:{tissueTime:time}};
  art.backdrop(camera);art.g.save();art.g.translate(-camera,0);drawStalkerRoofs(art,camera,time);art.floor(solids,camera);if(!mob.dead)art.enemy(mob);
  art.actor({...player,face:1,onGround:true,ax:1,ay:0},'blue');art.g.restore();
  const label={cling:'沿顶部爬行',windup:'收肢蓄力',pounce:'跃下扑击',land:'落地缓冲',run:'地面追击'}[mob.phase];
  art.hudText('第八关 · '+label,192,7,'#edc5df',7,'center');art.present(ctx);
  window.stalkerPreview={ready:true,time,paused,phase:mob.phase,x:mob.x,y:mob.y,playerX:player.x};requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script></html>
